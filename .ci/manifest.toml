[[deps]]
compiler-inputs = []
package = "cfgrib"
python-version-input = "python-version"
ref = "master"
repo = "ecmwf/cfgrib"

[[deps]]
compiler-inputs = []
package = "pdbufr"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/pdbufr"

[[deps]]
compiler-inputs = []
package = "pyodc"
python-version-input = "python-version"
ref = "master"
repo = "ecmwf/pyodc"

[[deps]]
compiler-inputs = ["cxx-compiler"]
package = "pyfdb"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/fdb"

[[deps]]
compiler-inputs = ["cxx-compiler"]
package = "pymetkit"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/metkit"

# Pure-Python upstreams, built on the GitHub runner rather than in this container.
[[deps]]
build-type-input = "python-build-type"
compiler-inputs = []
package = "multiurl"
platform-input = "python-platform"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/multiurl"

[[deps]]
build-type-input = "python-build-type"
compiler-inputs = []
package = "earthkit-utils"
platform-input = "python-platform"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/earthkit-utils"

[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

# The container and compiler of the eccodes, odc, and fdb builds, whose libraries the tests load.
[matrix.test.defaults]
build-type = "RelWithDebInfo"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13"
cxx-compiler = "g++-13"
extras = "all,test,ci"
job-script = "./.ci/test.sh.j2"
platform = "ubuntu-24.04"
python-build-type = "Release"
python-platform = "gh-ubuntu-26.04"
runs-on = "ubuntu-24.04"

[[matrix.test.include]]
python-version = "3.11"

[[matrix.test.include]]
python-version = "3.12"

[[matrix.test.include]]
python-version = "3.13"

[package]
ci-pre-commit = false
compiler-inputs = []
fork-pull-requests = false
full-history = true
name = "earthkit-data"
repo = "ecmwf/earthkit-data"
visibility = "public"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit-transforms"

[[trigger-downstream]]
ref = "main"
repo = "ecmwf/earthkit-workflows"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit-hydro"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit-geo"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit-meteo"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit-plots"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit"
